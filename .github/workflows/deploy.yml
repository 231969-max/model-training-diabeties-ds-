name: CI/CD Pipeline - Test, Build & Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and branch write
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: CI (Validation, Unit Testing, and Production Build)
  # =========================================================================
  ci-build-and-test:
    name: 'CI - Validation & Build'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10 for Flask Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Execute Flask Backend Unit Tests
        run: |
          python test_app.py

      - name: 🟢 Set up Node.js 22.x for Angular Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend npm Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🧪 Run Angular Unit Tests (Vitest)
        working-directory: frontend
        run: npm run test:ci

      - name: 🏗️ Build Angular Frontend for GitHub Pages
        working-directory: frontend
        run: npm run build:gh-pages

      - name: 📄 Configure Single-Page Routing (404.html & .nojekyll)
        run: |
          cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html
          touch frontend/dist/frontend/browser/.nojekyll

      - name: 📤 Upload GitHub Pages Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  # =========================================================================
  # STAGE 2: CD (Automated Deployment to GitHub Pages)
  # =========================================================================
  cd-deploy-github-pages:
    name: 'CD - Deployment to GitHub Pages'
    needs: ci-build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages (Native Actions)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 📥 Checkout Repository (Fallback Branch Deployment)
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install & Build Frontend Dist
        working-directory: frontend
        run: |
          npm ci
          npm run build:gh-pages
          cp dist/frontend/browser/index.html dist/frontend/browser/404.html
          touch dist/frontend/browser/.nojekyll

      - name: 🚀 Deploy to gh-pages Branch (Alternative / Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist/frontend/browser
          force_orphan: true
